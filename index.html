<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5ef">
    <meta name="description" content="Welcome to Okener Enterprises. A home for new ideas, projects, and possibilities.">
    <title>Okener Enterprises</title>
    <link rel="canonical" href="https://okener.com/">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      :root { color-scheme: light; --paper: #f6f5ef; --ink: #203d30; --muted: #657065; --line: #d8ddd1; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
      .page { min-height: 100svh; max-width: 1600px; margin: auto; padding: 36px 6vw 24px; display: flex; flex-direction: column; }
      header { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; letter-spacing: -.02em; }
      .mark { width: 30px; height: 30px; border: 7px solid var(--ink); border-radius: 50%; }
      main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 80px 0; }
      .intro { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
      .dot { height: 6px; width: 6px; background: var(--ink); border-radius: 50%; }
      h1 { font-size: clamp(80px, 19vw, 285px); font-weight: 500; letter-spacing: -.075em; line-height: 1; margin: 20px 0 42px -.065em; }
      .details { border-top: 1px solid var(--line); padding-top: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
      h2 { margin: 0; font-size: clamp(24px, 3vw, 40px); line-height: 1.2; font-weight: 400; letter-spacing: -.04em; }
      .description { max-width: 360px; margin: 0; color: var(--muted); font-size: 16px; line-height: 1.65; }
      footer { display: flex; justify-content: space-between; gap: 20px; border-top: 1px solid var(--line); padding-top: 20px; color: var(--muted); font-size: 11px; line-height: 1.5; }
      @media (max-width: 600px) {
        .page { padding: 26px 7vw 22px; }
        main { padding: 72px 0; }
        h1 { font-size: 21vw; margin-bottom: 32px; }
        .details { grid-template-columns: 1fr; gap: 18px; padding-top: 24px; }
        .description { font-size: 15px; }
        footer { flex-wrap: wrap; gap: 8px 24px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header><span class="mark" aria-hidden="true"></span><span>Okener Enterprises</span></header>
      <main>
        <div class="intro"><span class="dot" aria-hidden="true"></span>A world of possibility</div>
        <h1>Okener.</h1>
        <div class="details">
          <h2>Building what’s next.</h2>
          <p class="description">Welcome to Okener Enterprises. A home for new ideas, projects, and possibilities.</p>
        </div>
      </main>
      <footer><span>© 2026 Okener Enterprises</span><span>okener.com</span></footer>
    </div>
  </body>
</html>
